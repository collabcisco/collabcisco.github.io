<!DOCTYPE html>
<html>
<head>
    <title>Pedidos</title>
</head>
<body>

<h2>Pedidos</h2>

<table id="tabla" border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Bebida</th>
            <th>Cliente</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const url = "https://ftdicmhualkkolpnkxge.supabase.co/rest/v1/pedidos";
const apiKey = "sb_publishable_TnYDBmhVxadsiRFO6ofOGg_i1XpjF8B";

fetch(url, {
    headers: {
        "apikey": apiKey,
        "Authorization": "Bearer " + apiKey
    }
})
.then(r => r.json())
.then(datos => {

    const tbody = document.querySelector("#tabla tbody");

    datos.forEach(pedido => {

        tbody.innerHTML += `
            <tr>
                <td>${pedido.idpedido}</td>
                <td>${pedido.tipo}</td>
                <td>${pedido.cliente}</td>
            </tr>
        `;

    });

});
</script>

</body>
</html>
